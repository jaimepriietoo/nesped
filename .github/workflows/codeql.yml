# Análisis estático de seguridad del código (CodeQL).
#
# Busca en cada cambio y cada lunes los fallos que no se ven en una revisión
# rápida: inyecciones, rutas que devuelven datos de otra empresa, redirecciones
# abiertas, peticiones a direcciones que controla un atacante (SSRF),
# secretos que acaban en un log. Los avisos aparecen en la pestaña
# "Security" de GitHub y en el propio PR.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          # El conjunto ampliado: además de los fallos claros, los patrones
          # sospechosos. Da algo más de ruido y a cambio no se escapa tanto.
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
