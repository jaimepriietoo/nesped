<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acceder · Nesped (demo)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <style>
      body { display: grid; place-items: center; min-height: 100dvh; }

      .acceso {
        position: relative;
        z-index: 5;
        width: min(400px, calc(100vw - 36px));
        padding: 38px 34px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background: rgba(6, 6, 6, 0.82);
        backdrop-filter: blur(20px);
      }

      .acceso h1 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 28px;
        letter-spacing: -0.045em;
      }

      .acceso p { margin: 10px 0 28px; font-size: 13.5px; color: var(--muted); }

      .campo { display: block; margin-bottom: 16px; }

      .campo span {
        display: block;
        margin-bottom: 7px;
        font-family: var(--font-display);
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .campo input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 13px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font: inherit;
        font-size: 14px;
        outline: none;
        transition: border-color 0.25s ease;
      }

      .campo input:focus { border-color: rgba(255, 255, 255, 0.5); }

      .acceso .btn { width: 100%; margin-top: 8px; }

      .nota {
        margin: 22px 0 0;
        font-size: 12px;
        line-height: 1.6;
        color: #6f6f6f;
        text-align: center;
      }

      .aviso {
        margin-top: 14px;
        padding: 11px 14px;
        border: 1px solid rgba(255, 155, 155, 0.28);
        border-radius: 12px;
        background: rgba(255, 155, 155, 0.08);
        font-size: 12.5px;
        color: #ff9b9b;
      }

      .aviso[hidden] { display: none !important; }
    </style>
  </head>

  <body>
    <div class="bg">
      <video class="bg-video" autoplay muted loop playsinline>
        <source
          src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4"
          type="video/mp4"
        />
      </video>
    </div>

    <form class="acceso" id="form">
      <h1>Acceder</h1>
      <p>Entra al portal de tu cuenta.</p>

      <label class="campo">
        <span>EMAIL</span>
        <input type="email" id="email" autocomplete="username" required />
      </label>

      <label class="campo">
        <span>CONTRASEÑA</span>
        <input type="password" id="clave" autocomplete="current-password" required />
      </label>

      <div class="aviso" id="aviso" hidden></div>

      <button class="btn" data-v="light" type="submit">Entrar</button>

      <p class="nota">
        Esto es una demo: no hay servidor detrás.<br />
        <a href="index.html" style="color: #b8b8b8; text-decoration: underline">Volver al sitio</a>
      </p>
    </form>

    <script>
      // Demo sin servidor: sólo comprueba que los campos están rellenos y pasa
      // al portal. No hay credenciales guardadas aquí ni comprobación real.
      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const aviso = document.getElementById("aviso");
        const email = document.getElementById("email").value.trim();
        const clave = document.getElementById("clave").value;

        if (!email || !clave) {
          aviso.textContent = "Rellena el email y la contraseña.";
          aviso.hidden = false;
          return;
        }

        aviso.hidden = true;
        window.location.href = "portal.html";
      });
    </script>
  </body>
</html>
