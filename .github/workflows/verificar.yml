# La puerta antes de main.
#
# Hasta ahora cada push a main desplegaba a producción sin que nada ejecutara
# las pruebas. Este flujo corre lo mismo que se pide antes de tocar nada en el
# README —eslint, guardián de shaders, unidad, build y e2e— y la protección
# de la rama exige que esté en verde para fusionar.
#
# Las e2e levantan su propio servidor de desarrollo. Necesitan un secreto de
# sesión para firmar cookies de prueba; en CI es un valor sintético, que sólo
# vale dentro de esta ejecución. La prueba de precios necesita Stripe: si el
# repositorio no tiene STRIPE_SECRET_KEY entre sus secretos, esa prueba se
# salta a sí misma y lo dice.
name: verificar

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NESPED_SESSION_SECRET: ci-solo-para-esta-ejecucion-${{ github.run_id }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Ningún paquete ejecuta código al instalarse. Los tres que lo necesitan
      # se reconstruyen aparte: la lista es un allowlist que vigila un test.
      - name: Dependencias (sin scripts de instalación)
        run: npm ci --ignore-scripts

      - name: Scripts de instalación permitidos
        run: npm rebuild @sentry/cli unrs-resolver

      - name: Secretos en código e historial
        run: npm run revisar:secretos

      - name: Dependencias vulnerables
        run: npm audit --audit-level=high

      - name: Lint
        run: npx eslint app components lib tests scripts

      - name: Guardián de shaders y pruebas de unidad
        run: npm run test:unidad

      - name: Build
        run: npm run build

      - name: Navegador para las e2e
        run: npx playwright install --with-deps chromium

      - name: Pruebas e2e
        run: npx playwright test

      - name: Informe de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
