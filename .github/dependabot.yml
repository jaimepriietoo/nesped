# Avisos semanales de dependencias, agrupados para que revisar sea un solo PR.
# Las versiones mayores quedan fuera de los grupos: se miran una a una.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencias"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    labels: ["dependencias"]
